name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install fastapi 'uvicorn[standard]' pydantic pillow \
            opencv-python-headless numpy scikit-image psd-tools \
            python-multipart pytest httpx
      - name: Run tests
        run: python -m pytest app/tests -q
      - name: Verify schema export
        run: python scripts/export_schemas.py

  frontend:
    name: Frontend (tsc / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
