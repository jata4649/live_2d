[project]
name = "autolive2d-layer-studio-api"
version = "0.1.0"
description = "AutoLive2D Layer Studio backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "psd-tools>=1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ai = ["anthropic>=0.116"]
# SAM2 は PyPI 未公開のため GitHub から:
#   pip install torch && pip install "git+https://github.com/facebookresearch/sam2.git"
sam2 = ["torch>=2.3.1"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
